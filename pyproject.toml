[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aag-book2pdf"
version = "1.5.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
readme = "README.md"
description = "Conservative scanned .book recovery with a Hebrew Linux and Windows desktop interface"
requires-python = ">=3.11"
dependencies = ["cryptography>=43", "Pillow>=11", "pikepdf>=9,<11", "PyMuPDF>=1.25,<2", "PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
turbo-recover = "book2pdf.turbosun.core:main"
book2pdf = "book2pdf.cli:main"
aag-book2pdf = "book2pdf.gui.app:main"

[tool.setuptools.packages.find]
include = ["book2pdf*"]

[tool.setuptools.package-data]
"book2pdf.gui" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
