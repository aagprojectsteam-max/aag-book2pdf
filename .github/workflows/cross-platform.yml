name: Cross-platform Python validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt and qpdf runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qpdf libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libdjvulibre21
      - run: python -m pip install ".[test]"
      - name: Linux regression
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Prepare verified native Windows BKF runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26 zstandard==0.25.0
          python scripts/prepare_windows_runtime.py
          "BOOK2PDF_DJVU_LIBRARY=$pwd\.build\djvu-runtime\libdjvulibre-21.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native Windows tests
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q
  # Packaging is deliberately manual until native real-book Python acceptance
  # exists for the exact BuildKit commit. build_windows.ps1 checks that evidence.
